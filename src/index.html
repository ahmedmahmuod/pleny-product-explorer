<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClickTik Product Explorer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <script>
      // Apply theme before Angular renders to avoid a light-theme flash.
      try {
        const savedTheme = localStorage.getItem('clicktik-theme');
        document.documentElement.dataset['theme'] =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        document.documentElement.dataset['theme'] = 'light';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
