<details #menu class="account-menu">
  <summary #trigger [attr.aria-label]="accountLabel()">
    <svg class="account-icon" aria-hidden="true" viewBox="0 0 24 24">
      <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" />
    </svg>
    <span>Account</span>
    <svg class="chevron" aria-hidden="true" viewBox="0 0 20 20">
      <path d="m6 8 4 4 4-4" />
    </svg>
  </summary>

  <div class="account-menu-panel">
    <label class="theme-option">
      <span class="theme-option-label">
        @if (isDark()) {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        }
        {{ themeLabel() }}
      </span>

      <span class="theme-switch-control">
        <input
          #themeToggle
          type="checkbox"
          role="switch"
          [checked]="isDark()"
          (change)="setDarkMode(themeToggle.checked)"
        />
        <span class="theme-switch-track" aria-hidden="true">
          <span class="theme-switch-thumb"></span>
        </span>
      </span>
    </label>

    <button class="logout-button" type="button" (click)="logout()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M10 17v2H5V5h5v2m5 3 3 2-3 2m3-2H9" />
      </svg>
      Log out
    </button>
  </div>
</details>
