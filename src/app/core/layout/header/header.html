<header>
  <nav aria-label="Primary navigation">
    <div class="navigation-start">
      <a class="brand" routerLink="/home" aria-label="ClickTik home">
        <img class="brand-logo" src="assets/images/logo.png" alt="" width="32" height="32" />
        <span>ClickTik</span>
      </a>

      <app-primary-navigation />
    </div>

    @if (authStore.isAuthenticated()) {
      <div class="authenticated-actions">
        <app-product-search />
        <app-cart-badge [count]="cartStore.totalQuantity()" [loading]="cartStore.isLoading()" />
        <app-account-menu />
      </div>
    } @else {
      <a class="nav-link" routerLink="/login" routerLinkActive="nav-link--active" ariaCurrentWhenActive="page">
        Log in
      </a>
    }
  </nav>
</header>
